[project]
name = "alba-os-prompt-intelligence"
version = "0.1.0"
description = "Local prompt intelligence for evidence-backed multimodal generation recommendations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.403,<2.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "-p",
    "no:cacheprovider",
    "-m",
    "not e2e and not ollama",
]
asyncio_mode = "auto"
markers = [
    "docker: requires control of the Docker Engine",
    "e2e: restarts or coordinates external services and is excluded by default",
    "ollama: requires local Ollama and the explicitly pre-pulled model under test",
    "postgres: requires the real PostgreSQL/pgvector service",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
