{% extends "base.html" %}
{% block title %}Request error · Alba OS{% endblock %}
{% block content %}
  <section class="card error-page">
    <h1>Request could not be completed</h1>
    <p>{{ error_message }}</p>
    <p class="muted">Reference: {{ error_code }}</p>

  </section>
{% endblock %}
