name: alba-os

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${ALBA_POSTGRES_USER:-alba}
      POSTGRES_PASSWORD: ${ALBA_POSTGRES_PASSWORD:-alba_dev}
      POSTGRES_DB: ${ALBA_POSTGRES_DB:-alba_os}
      TZ: UTC
    ports:
      - "${ALBA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - alba_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  alba_postgres_data:
